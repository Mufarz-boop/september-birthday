<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>September Birthday · Cosmic Gateway</title>

    <!-- Google Fonts: Cormorant Garamond + Inter (elegant & cinematic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- GSAP (CDN, HTTPS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Three.js (CDN, HTTPS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* no horizontal overflow, no scroll */
            background: #000000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* fallback gradient if WebGL fails */
        body {
            background: radial-gradient(circle at 50% 40%, #0b0a1a 0%, #03010a 80%, #000000 100%);
        }

        /* WebGL canvas + fallback canvas layer */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* allow interaction with overlay */
        }

        /* overlay content sits on top */
        .overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100svh; /* modern viewport height */
            min-height: 100vh; /* fallback */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            pointer-events: none; /* let clicks pass to button only */
        }

        .content {
            pointer-events: auto; /* re-enable for text & button */
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
            opacity: 0; /* animated by GSAP / CSS fallback */
            transform: translateY(20px);
        }

        /* Date line */
        .date {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 245, 220, 0.75);
            text-shadow: 0 0 20px rgba(255, 200, 120, 0.3);
            margin-bottom: 0.5rem;
            opacity: 0;
        }

        /* Main headline */
        .main-text {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: clamp(2.4rem, 9vw, 5rem);
            line-height: 1.2;
            color: #f5efe0;
            text-shadow: 0 0 40px rgba(200, 170, 255, 0.4), 0 0 80px rgba(180, 120, 255, 0.2);
            letter-spacing: 0.02em;
            opacity: 0;
        }

        .main-text span {
            display: block;
            font-style: italic;
            color: #e8d9b0;
            font-weight: 300;
            font-size: 0.9em;
            margin-top: 0.2rem;
        }

        /* Subtitle */
        .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            text-shadow: 0 0 30px rgba(150, 120, 200, 0.5);
            opacity: 0;
        }

        /* OPEN button */
        .open-btn {
            pointer-events: auto;
            margin-top: 1.5rem;
            padding: 1rem 3.2rem;
            background: transparent;
            border: 1px solid rgba(255, 240, 200, 0.4);
            border-radius: 60px;
            color: #f0e6d0;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(200, 170, 255, 0.1);
            opacity: 0;
            transform: scale(0.95);
            outline: none;
            /* keyboard focus visible */
        }

        .open-btn:focus-visible {
            outline: 2px solid #d4b87a;
            outline-offset: 4px;
        }

        .open-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 240, 200, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .open-btn:hover {
            border-color: rgba(255, 220, 150, 0.8);
            box-shadow: 0 0 40px rgba(220, 190, 130, 0.3), 0 0 80px rgba(160, 120, 255, 0.2);
            transform: scale(1.03);
            letter-spacing: 0.6em;
            color: #fff5e0;
        }

        .open-btn:hover::after {
            opacity: 1;
        }

        /* light sweep on hover */
        .open-btn .sweep {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 210, 0.2), transparent);
            transition: left 0.9s ease;
            pointer-events: none;
        }

        .open-btn:hover .sweep {
            left: 100%;
        }

        /* mobile touch friendly */
        @media (hover: none) {
            .open-btn:hover {
                transform: scale(0.98);
                border-color: rgba(255, 220, 150, 0.5);
                box-shadow: 0 0 30px rgba(200, 170, 255, 0.2);
            }
            .open-btn:active {
                transform: scale(1.02);
                border-color: rgba(255, 220, 150, 0.9);
                box-shadow: 0 0 50px rgba(220, 190, 130, 0.4);
                background: rgba(255, 240, 200, 0.05);
            }
        }

        /* ---------- FALLBACK CSS STARS (if WebGL fails) ---------- */
        .fallback-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none; /* toggled by JS */
        }

        .fallback-stars .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ---------- FLASH OVERLAY FOR TRANSITION ---------- */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 245, 210, 0.95) 0%, rgba(200, 170, 255, 0.8) 40%, rgba(0, 0, 0, 0.9) 100%);
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
        }

        /* ---------- REDUCED MOTION ---------- */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .content, .date, .main-text, .subtitle, .open-btn {
                opacity: 1 !important;
                transform: none !important;
            }
            .open-btn:hover {
                transform: none !important;
            }
        }

        /* safe area for notches */
        .overlay {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>

    <!-- WebGL / Three.js container -->
    <div id="canvas-container"></div>

    <!-- CSS fallback stars (shown only if Three.js fails) -->
    <div id="fallbackStars" class="fallback-stars"></div>

    <!-- overlay content -->
    <div class="overlay">
        <div class="content" id="content">
            <div class="date" id="date">SEPTEMBER 14, 2026</div>
            <h1 class="main-text" id="mainText">
                There is something<br><span>waiting for you.</span>
            </h1>
            <p class="subtitle" id="subtitle">Take a moment and open it.</p>
            <button class="open-btn" id="openBtn" aria-label="Open the birthday surprise">
                <span class="sweep"></span>
                OPEN
            </button>
        </div>
    </div>

    <!-- flash overlay for cinematic transition -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <script>
        (function() {
            'use strict';

            // ---------- CONFIG & GLOBALS ----------
            const isMobile = window.innerWidth < 768;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // particle count based on device
            const particleCount = isMobile ? 900 : 3200; // mobile 700-1500, desktop 2500-4000

            let scene, camera, renderer, galaxyGroup, starField, nebulaMesh, centralLight;
            let threeJSAvailable = typeof THREE !== 'undefined';
            let gsapAvailable = typeof gsap !== 'undefined';

            // for animation
            let clock = new THREE.Clock();
            let mouseX = 0, mouseY = 0;
            let targetMouseX = 0, targetMouseY = 0;
            let shootingStarTimer = 0;
            let shootingStars = [];

            // DOM elements
            const canvasContainer = document.getElementById('canvas-container');
            const fallbackStars = document.getElementById('fallbackStars');
            const contentEl = document.getElementById('content');
            const dateEl = document.getElementById('date');
            const mainTextEl = document.getElementById('mainText');
            const subtitleEl = document.getElementById('subtitle');
            const openBtn = document.getElementById('openBtn');
            const flashOverlay = document.getElementById('flashOverlay');

            // ---------- FALLBACK: CSS STARS & BASIC ANIMATION ----------
            function setupFallbackStars() {
                if (!fallbackStars) return;
                const count = isMobile ? 120 : 300;
                let html = '';
                for (let i = 0; i < count; i++) {
                    const size = Math.random() * 2.5 + 0.5;
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const delay = Math.random() * 4;
                    const duration = 2 + Math.random() * 4;
                    html += `<div class="star" style="left:${x}%; top:${y}%; width:${size}px; height:${size}px; animation-delay:${delay}s; animation-duration:${duration}s;"></div>`;
                }
                fallbackStars.innerHTML = html;
            }

            // show fallback stars if Three.js fails
            function activateFallback() {
                if (fallbackStars) fallbackStars.style.display = 'block';
                // also hide canvas container if empty
                if (canvasContainer) canvasContainer.style.display = 'none';
            }

            // ---------- THREE.JS SCENE ----------
            function initThree() {
                if (!threeJSAvailable) {
                    activateFallback();
                    return false;
                }

                try {
                    // scene, camera, renderer
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x03010a); // deep black/blue

                    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 0, 14);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.shadowMap.enabled = false; // performance
                    canvasContainer.appendChild(renderer.domElement);

                    // ---- Galaxy group (rotates slowly) ----
                    galaxyGroup = new THREE.Group();
                    scene.add(galaxyGroup);

                    // ---- Star field (main particles) ----
                    const starGeometry = new THREE.BufferGeometry();
                    const positions = new Float32Array(particleCount * 3);
                    const colors = new Float32Array(particleCount * 3);
                    const sizes = new Float32Array(particleCount);

                    // color palette: deep blue, violet, magenta, soft gold
                    const colorPalette = [
                        new THREE.Color(0x5a4a8a), // deep violet
                        new THREE.Color(0x3a2a6a), // midnight blue
                        new THREE.Color(0x9a7ab0), // soft magenta
                        new THREE.Color(0xd4b87a), // soft gold
                        new THREE.Color(0xffffff), // white
                        new THREE.Color(0x7a6a9a)  // muted purple
                    ];

                    for (let i = 0; i < particleCount; i++) {
                        // spherical distribution, more concentrated near center but with depth
                        const radius = 4 + Math.random() * 20; // depth range
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);

                        // stretch along z-axis slightly to create depth
                        const x = radius * Math.sin(phi) * Math.cos(theta) * (0.8 + Math.random() * 0.4);
                        const y = radius * Math.sin(phi) * Math.sin(theta) * (0.6 + Math.random() * 0.5);
                        const z = radius * Math.cos(phi) * (0.9 + Math.random() * 0.3);

                        positions[i*3] = x;
                        positions[i*3+1] = y;
                        positions[i*3+2] = z;

                        // colors
                        const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                        // vary brightness
                        const brightness = 0.5 + Math.random() * 0.5;
                        colors[i*3] = col.r * brightness;
                        colors[i*3+1] = col.g * brightness;
                        colors[i*3+2] = col.b * brightness;

                        // sizes
                        sizes[i] = 0.1 + Math.random() * 0.7;
                    }

                    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                    // star material: circular points with glow
                    const starMaterial = new THREE.PointsMaterial({
                        size: 0.18,
                        vertexColors: true,
                        transparent: true,
                        opacity: 0.95,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        sizeAttenuation: true,
                        map: createCircleTexture()
                    });

                    starField = new THREE.Points(starGeometry, starMaterial);
                    galaxyGroup.add(starField);

                    // ---- Nebula (large soft gradient sprites) ----
                    // create a few large planes with radial gradient textures
                    const nebulaTexture = createNebulaTexture();
                    const nebulaMaterial = new THREE.MeshBasicMaterial({
                        map: nebulaTexture,
                        transparent: true,
                        opacity: 0.12,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    });

                    // three nebula planes at different depths and colors
                    const nebula1 = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), nebulaMaterial.clone());
                    nebula1.material.color.setHex(0x4a2a6a);
                    nebula1.position.set(0, 0, -8);
                    nebula1.material.opacity = 0.10;
                    galaxyGroup.add(nebula1);

                    const nebula2 = new THREE.Mesh(new THREE.PlaneGeometry(25, 25), nebulaMaterial.clone());
                    nebula2.material.color.setHex(0x6a3a5a);
                    nebula2.position.set(5, 3, -15);
                    nebula2.material.opacity = 0.08;
                    galaxyGroup.add(nebula2);

                    const nebula3 = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), nebulaMaterial.clone());
                    nebula3.material.color.setHex(0x2a3a6a);
                    nebula3.position.set(-4, -2, -5);
                    nebula3.material.opacity = 0.12;
                    galaxyGroup.add(nebula3);

                    // ---- Central light (glow sprite) ----
                    const centralGlowTexture = createCentralGlowTexture();
                    const centralGlowMaterial = new THREE.SpriteMaterial({
                        map: centralGlowTexture,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        transparent: true,
                        opacity: 0.0 // will animate
                    });
                    centralLight = new THREE.Sprite(centralGlowMaterial);
                    centralLight.scale.set(6, 6, 1);
                    centralLight.position.set(0, 0, -2);
                    galaxyGroup.add(centralLight);

                    // also a point light for subtle illumination (not strictly needed for sprites but nice)
                    const pointLight = new THREE.PointLight(0xd4b87a, 0.5, 30);
                    pointLight.position.set(0, 0, 2);
                    galaxyGroup.add(pointLight);

                    // ---- Shooting stars (separate object, not in galaxyGroup) ----
                    // We'll create them dynamically in the animation loop.

                    // ---- Initial camera and galaxy state ----
                    galaxyGroup.rotation.x = 0.1;
                    galaxyGroup.rotation.y = 0.2;

                    // ---- Animation loop ----
                    function animate() {
                        requestAnimationFrame(animate);

                        const delta = clock.getDelta();
                        const elapsedTime = performance.now() * 0.001; // seconds

                        // subtle rotation of galaxy
                        if (galaxyGroup) {
                            galaxyGroup.rotation.y += 0.0002;
                            galaxyGroup.rotation.x += 0.0001;
                        }

                        // camera movement forward slowly (intro)
                        // plus parallax based on mouse (only desktop)
                        if (!isMobile && !prefersReducedMotion) {
                            // smooth mouse follow
                            targetMouseX += (mouseX - targetMouseX) * 0.03;
                            targetMouseY += (mouseY - targetMouseY) * 0.03;

                            if (camera) {
                                camera.position.x += (targetMouseX * 1.5 - camera.position.x) * 0.02;
                                camera.position.y += (-targetMouseY * 1.0 - camera.position.y) * 0.02;
                                // keep looking at center
                                camera.lookAt(0, 0, -2);
                            }

                            // parallax for nebula elements (slight offset)
                            if (galaxyGroup) {
                                galaxyGroup.position.x = targetMouseX * 0.3;
                                galaxyGroup.position.y = -targetMouseY * 0.2;
                            }
                        } else {
                            // on mobile, just look at center
                            if (camera) camera.lookAt(0, 0, -2);
                        }

                        // central light pulsing
                        if (centralLight && centralLight.material) {
                            const pulse = 0.5 + Math.sin(elapsedTime * 1.5) * 0.15;
                            centralLight.material.opacity = 0.6 * pulse;
                            centralLight.scale.setScalar(5 + Math.sin(elapsedTime * 0.8) * 1.2);
                        }

                        // update shooting stars
                        updateShootingStars(delta);

                        // render
                        if (renderer && scene && camera) {
                            renderer.render(scene, camera);
                        }
                    }

                    // start animation
                    animate();

                    // handle resize
                    window.addEventListener('resize', onWindowResize);
                    // mouse move for parallax (desktop only)
                    if (!isMobile && !prefersReducedMotion) {
                        window.addEventListener('mousemove', onMouseMove);
                    }

                    // toggle shooting stars periodically
                    setInterval(() => {
                        if (!prefersReducedMotion && scene && camera) {
                            createShootingStar();
                        }
                    }, 4000 + Math.random() * 4000);

                    return true;
                } catch (e) {
                    console.warn('Three.js initialization failed:', e);
                    activateFallback();
                    return false;
                }
            }

            // ---------- HELPER: create circular texture for stars ----------
            function createCircleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 16;
                canvas.height = 16;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.arc(8, 8, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                // soft edge
                const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.8)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 16, 16);
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            // ---------- HELPER: nebula gradient texture ----------
            function createNebulaTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                gradient.addColorStop(0, 'rgba(180, 140, 220, 0.8)');
                gradient.addColorStop(0.3, 'rgba(120, 80, 180, 0.4)');
                gradient.addColorStop(0.6, 'rgba(80, 40, 120, 0.15)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 256, 256);
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            // ---------- HELPER: central glow texture ----------
            function createCentralGlowTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                gradient.addColorStop(0, 'rgba(255, 240, 200, 1)');
                gradient.addColorStop(0.2, 'rgba(255, 220, 150, 0.8)');
                gradient.addColorStop(0.5, 'rgba(200, 160, 255, 0.3)');
                gradient.addColorStop(1, 'rgba(100, 50, 150, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 128, 128);
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            // ---------- SHOOTING STARS (dynamic) ----------
            function createShootingStar() {
                if (!scene) return;

                // create a line or small sprite that moves quickly
                const starCanvas = document.createElement('canvas');
                starCanvas.width = 32;
                starCanvas.height = 8;
                const ctx = starCanvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 4, 32, 4);
                grad.addColorStop(0, 'rgba(255,255,255,0)');
                grad.addColorStop(0.5, 'rgba(255,255,220,1)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 2, 32, 4);

                const texture = new THREE.CanvasTexture(starCanvas);
                const material = new THREE.SpriteMaterial({
                    map: texture,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true
                });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(2.5, 0.4, 1);

                // random start position (left side, top or bottom half)
                const startX = -20 - Math.random() * 10;
                const startY = (Math.random() - 0.5) * 20;
                const startZ = -10 - Math.random() * 15;
                sprite.position.set(startX, startY, startZ);

                // direction: moving right and slightly up/down
                const speedX = 15 + Math.random() * 12;
                const speedY = (Math.random() - 0.5) * 4;
                const speedZ = (Math.random() - 0.5) * 2;

                // store velocity and life
                sprite.userData = {
                    velocity: new THREE.Vector3(speedX, speedY, speedZ),
                    life: 0,
                    maxLife: 2.5 + Math.random() * 1.5
                };

                scene.add(sprite);
                shootingStars.push(sprite);
            }

            function updateShootingStars(delta) {
                if (!delta) delta = 0.016;
                for (let i = shootingStars.length - 1; i >= 0; i--) {
                    const star = shootingStars[i];
                    const data = star.userData;
                    data.life += delta;

                    // move
                    star.position.x += data.velocity.x * delta;
                    star.position.y += data.velocity.y * delta;
                    star.position.z += data.velocity.z * delta;

                    // fade out
                    const lifeRatio = data.life / data.maxLife;
                    star.material.opacity = Math.max(0, 1 - lifeRatio);

                    // remove if done or off screen
                    if (data.life >= data.maxLife || star.position.x > 40) {
                        scene.remove(star);
                        star.material.dispose();
                        star.geometry?.dispose();
                        shootingStars.splice(i, 1);
                    }
                }
            }

            // ---------- MOUSE PARALLAX ----------
            function onMouseMove(event) {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = (event.clientY / window.innerHeight) * 2 - 1;
            }

            // ---------- RESIZE ----------
            function onWindowResize() {
                if (camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                }
            }

            // ---------- INTRO ANIMATION (GSAP or fallback) ----------
            function runIntro() {
                // if reduced motion, just show everything immediately
                if (prefersReducedMotion) {
                    contentEl.style.opacity = '1';
                    contentEl.style.transform = 'none';
                    dateEl.style.opacity = '1';
                    mainTextEl.style.opacity = '1';
                    subtitleEl.style.opacity = '1';
                    openBtn.style.opacity = '1';
                    openBtn.style.transform = 'scale(1)';
                    return;
                }

                // GSAP available?
                if (gsapAvailable) {
                    const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

                    // initial states
                    gsap.set(contentEl, { opacity: 0, y: 30 });
                    gsap.set(dateEl, { opacity: 0, y: 10 });
                    gsap.set(mainTextEl, { opacity: 0, y: 20 });
                    gsap.set(subtitleEl, { opacity: 0, y: 10 });
                    gsap.set(openBtn, { opacity: 0, scale: 0.9 });

                    // timeline: darkness -> stars (handled by three.js render start) -> text
                    tl.to(dateEl, { opacity: 1, y: 0, duration: 1.2, delay: 2.5 })
                      .to(mainTextEl, { opacity: 1, y: 0, duration: 1.5 }, '-=0.6')
                      .to(subtitleEl, { opacity: 1, y: 0, duration: 1.2 }, '-=0.8')
                      .to(openBtn, { opacity: 1, scale: 1, duration: 1.2, ease: 'back.out(1.2)' }, '-=0.6')
                      .to(contentEl, { opacity: 1, y: 0, duration: 1.0 }, '-=1.0');
                } else {
                    // CSS fallback: just fade in with transitions
                    setTimeout(() => {
                        contentEl.style.transition = 'opacity 1.5s ease, transform 1.5s ease';
                        contentEl.style.opacity = '1';
                        contentEl.style.transform = 'translateY(0)';
                        dateEl.style.transition = 'opacity 1.2s ease';
                        dateEl.style.opacity = '1';
                        mainTextEl.style.transition = 'opacity 1.5s ease';
                        mainTextEl.style.opacity = '1';
                        subtitleEl.style.transition = 'opacity 1.2s ease';
                        subtitleEl.style.opacity = '1';
                        openBtn.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
                        openBtn.style.opacity = '1';
                        openBtn.style.transform = 'scale(1)';
                    }, 2500);
                }
            }

            // ---------- CINEMATIC TRANSITION ----------
            function handleOpen() {
                // if reduced motion, go directly
                if (prefersReducedMotion) {
                    navigateToAmplop();
                    return;
                }

                // if GSAP not available, use simple fade + navigate
                if (!gsapAvailable) {
                    // simple fade with CSS
                    contentEl.style.transition = 'opacity 0.8s ease';
                    contentEl.style.opacity = '0';
                    flashOverlay.style.transition = 'opacity 1.2s ease';
                    flashOverlay.style.opacity = '0.8';
                    setTimeout(() => {
                        navigateToAmplop();
                    }, 1200);
                    return;
                }

                // GSAP cinematic transition
                const tl = gsap.timeline({
                    onComplete: () => {
                        navigateToAmplop();
                    }
                });

                // 1. button fades
                tl.to(openBtn, { opacity: 0, scale: 0.9, duration: 0.6, ease: 'power2.in' })
                  // 2. galaxy accelerates / camera zooms forward (approximate by scaling galaxy group)
                  .to(galaxyGroup ? galaxyGroup.scale : {}, { x: 3, y: 3, z: 3, duration: 2.0, ease: 'power2.in' }, '-=0.2')
                  // 3. stars stretch toward viewer (via camera position)
                  .to(camera ? camera.position : {}, { z: 6, duration: 2.0, ease: 'power2.in' }, '-=2.0')
                  // 4. central light becomes brighter
                  .to(centralLight ? centralLight.material : {}, { opacity: 1, duration: 1.2 }, '-=1.8')
                  .to(centralLight ? centralLight.scale : {}, { x: 15, y: 15, duration: 1.5 }, '-=1.8')
                  // 5. white/golden flash
                  .to(flashOverlay, { opacity: 0.95, duration: 0.8, ease: 'power2.in' }, '-=0.9')
                  // 6. screen fades (overlay opacity to black)
                  .to(flashOverlay, { opacity: 0, duration: 0.6, ease: 'power2.out' }, '-=0.2')
                  // content fade out
                  .to(contentEl, { opacity: 0, duration: 0.5 }, '-=1.0');
            }

            // navigate to amplop.html (relative path)
            function navigateToAmplop() {
                // attempt to play ambient audio if available (optional)
                try {
                    const audio = new Audio('assets/audio/ambient.mp3');
                    audio.volume = 0.4;
                    audio.play().catch(() => {}); // ignore errors
                } catch (e) { /* silent */ }

                window.location.href = 'pages/amplop.html';
            }

            // ---------- INIT ON LOAD ----------
            function init() {
                // setup fallback stars always (hidden unless needed)
                setupFallbackStars();

                // try to init Three.js
                const threeSuccess = initThree();

                // if three failed, show fallback stars
                if (!threeSuccess) {
                    activateFallback();
                }

                // start intro animation
                runIntro();

                // attach button event
                openBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    handleOpen();
                });

                // keyboard accessibility: Enter/Space on button is default, but ensure
                openBtn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleOpen();
                    }
                });

                // preload hint (optional)
                console.log('September Birthday · Cosmic Gateway ready.');
            }

            // start when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
