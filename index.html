<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>September Birthday · A letter for you</title>
  <style>
    /* ── RESET & BASE ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #0e0b0a;
      --background-alt: #1a1512;
      --paper: #f9f3e9;
      --paper-deep: #efe6d8;
      --text: #2e2722;
      --text-soft: #5a4e45;
      --accent: #c9a87c;
      --accent-glow: #e6cbaa;
      --shadow-soft: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
      --shadow-deep: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
      --radius-envelope: 1.2rem;
      --radius-letter: 1.5rem;
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--background);
      font-family: var(--font-sans);
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 1.2s var(--transition-smooth);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(201, 168, 124, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── SCENE SYSTEM ── */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s var(--transition-smooth), transform 1s var(--transition-smooth);
      transform: scale(0.98);
      z-index: 10;
      padding: 1.5rem;
      overflow-y: auto;
      overflow-x: hidden;
      will-change: opacity, transform;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 20;
    }

    .scene.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .scene.leaving {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* ── PARTICLE CANVAS ── */
    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    /* ── TYPOGRAPHY ── */
    .serif {
      font-family: var(--font-serif);
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    .gold {
      color: var(--accent);
    }

    /* ── SCENE 0: LOADING ── */
    .loading-scene {
      background: radial-gradient(ellipse at 50% 40%, #1a1410 0%, #0a0807 100%);
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      text-align: center;
      z-index: 5;
      width: 100%;
      max-width: 400px;
    }

    .loading-heart {
      font-size: clamp(3rem, 12vw, 5rem);
      color: var(--accent);
      animation: heartbeat 1.5s ease-in-out infinite;
      text-shadow: 0 0 40px rgba(201, 168, 124, 0.4);
      line-height: 1;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
      60% { transform: scale(1); }
    }

    .loading-title {
      font-family: var(--font-serif);
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      color: var(--paper);
      letter-spacing: 0.2em;
      font-weight: 300;
      opacity: 0.9;
    }

    .loading-subtitle {
      font-family: var(--font-serif);
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: var(--accent);
      letter-spacing: 0.15em;
      font-style: italic;
      opacity: 0.7;
    }

    .loading-bar-wrapper {
      width: 100%;
      height: 3px;
      background: rgba(201, 168, 124, 0.15);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-glow));
      border-radius: 3px;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px rgba(201, 168, 124, 0.5);
    }

    .loading-percent {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: rgba(255, 250, 240, 0.4);
      letter-spacing: 0.15em;
      margin-top: 0.5rem;
    }

    /* ── SCENE 0.5: COUNTDOWN ── */
    .countdown-scene {
      background: radial-gradient(ellipse at 50% 40%, #1f1814 0%, #0e0b0a 100%);
    }

    .countdown-scene-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      z-index: 5;
      width: 100%;
      max-width: 600px;
    }

    .countdown-scene-label {
      font-family: var(--font-serif);
      font-size: clamp(1rem, 4vw, 1.4rem);
      color: var(--accent-glow);
      letter-spacing: 0.2em;
      font-style: italic;
      opacity: 0.9;
    }

    .countdown-scene-date {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 7vw, 3rem);
      color: var(--paper);
      letter-spacing: 0.1em;
      font-weight: 300;
    }

    .countdown-big {
      display: flex;
      gap: clamp(0.8rem, 3vw, 2.5rem);
      margin-top: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .countdown-big-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 4rem;
    }

    .countdown-big-value {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 12vw, 4.5rem);
      color: var(--accent);
      font-weight: 400;
      line-height: 1;
      text-shadow: 0 0 40px rgba(201, 168, 124, 0.3);
      font-variant-numeric: tabular-nums;
    }

    .countdown-big-label {
      font-size: clamp(0.65rem, 2.5vw, 0.8rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 250, 240, 0.5);
      margin-top: 0.5rem;
      font-family: var(--font-sans);
    }

    .countdown-scene-message {
      font-family: var(--font-serif);
      font-size: clamp(1rem, 4vw, 1.4rem);
      color: var(--accent-glow);
      font-style: italic;
      margin-top: 1rem;
      letter-spacing: 0.05em;
    }

    .countdown-continue-btn {
      margin-top: 2.5rem;
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      padding: 0.9rem 3rem;
      border-radius: 3rem;
      font-size: clamp(0.85rem, 3vw, 1rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s var(--transition-smooth);
      font-family: var(--font-sans);
      font-weight: 400;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .countdown-continue-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .countdown-continue-btn:hover {
      background: var(--accent);
      color: var(--background);
      box-shadow: 0 0 30px rgba(201, 168, 124, 0.4);
      transform: translateY(-2px);
    }

    .countdown-continue-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* ── SCENE 1: ENVELOPE ── */
    .envelope-scene {
      background: radial-gradient(ellipse at 50% 40%, #1f1814 0%, #0e0b0a 100%);
    }

    .envelope-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 1.6 / 1;
      max-width: 380px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s var(--transition-smooth), box-shadow 0.6s ease;
      will-change: transform;
      filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.7));
      animation: floatEnvelope 5s ease-in-out infinite;
      border-radius: 0.6rem;
      outline: none;
    }

    .envelope:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 8px;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-10px) rotateX(1deg); }
    }

    .envelope:hover {
      transform: translateY(-6px) scale(1.01) rotateX(1deg);
      filter: drop-shadow(0 30px 45px rgba(0, 0, 0, 0.8));
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: #d9c9b4;
      border-radius: 0.6rem;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #e8d9c5, #d4c2ab);
      border-radius: 0.6rem;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), inset 0 0 40px rgba(255, 250, 240, 0.6);
      transform-origin: bottom center;
      transition: transform 1s var(--transition-smooth);
      backface-visibility: hidden;
    }

    .envelope-body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/></filter><rect width="100" height="100" filter="url(%23n)" opacity="0.04"/></svg>');
      opacity: 0.3;
      pointer-events: none;
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #e8d9c5, #d4c2ab);
      border-radius: 0.6rem;
      clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
      box-shadow: inset 0 -2px 8px rgba(0, 0, 0, 0.08);
      z-index: 2;
      backface-visibility: hidden;
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 52%;
      background: linear-gradient(145deg, #f0e2cf, #ddccb6);
      border-radius: 0.6rem 0.6rem 0 0;
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.9s var(--transition-smooth), z-index 0.3s step-end;
      z-index: 4;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      backface-visibility: hidden;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .envelope-flap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255, 250, 240, 0.3), transparent);
      border-radius: inherit;
      pointer-events: none;
    }

    .envelope.open .envelope-flap {
      transform: rotateX(-180deg);
      z-index: 1;
      transition: transform 0.9s var(--transition-smooth), z-index 0.3s step-start;
    }

    .wax-seal {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      width: 4rem;
      height: 4rem;
      background: radial-gradient(circle at 35% 35%, #c0392b, #8e1f1a);
      border-radius: 50%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #f0d9b0;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5), inset 0 -2px 5px rgba(0, 0, 0, 0.5), inset 0 3px 5px rgba(255, 215, 180, 0.4);
      transition: transform 0.5s var(--transition-smooth), opacity 0.5s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 200, 150, 0.3);
      font-family: var(--font-serif);
    }

    .envelope.open .wax-seal {
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
    }

    .instruction {
      margin-top: 2.5rem;
      text-align: center;
      color: var(--paper);
      font-size: clamp(0.85rem, 3vw, 1rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
      transition: opacity 0.8s ease;
      font-weight: 300;
      z-index: 5;
    }

    .instruction .primary {
      display: block;
      font-size: clamp(1rem, 4vw, 1.2rem);
      letter-spacing: 0.2em;
      margin-bottom: 0.25rem;
      color: var(--accent-glow);
      font-weight: 400;
    }

    .instruction .secondary {
      display: block;
      font-size: 0.75rem;
      opacity: 0.6;
      font-style: italic;
      letter-spacing: 0.08em;
    }

    /* ── SCENE 2: LETTER ── */
    .letter-scene {
      background: radial-gradient(ellipse at 50% 30%, #1d1613 0%, #0b0908 100%);
    }

    .letter-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .letter-paper {
      background: var(--paper);
      background-image: 
        linear-gradient(rgba(200, 180, 150, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 180, 150, 0.06) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px;
      color: var(--text);
      padding: clamp(2rem, 6vw, 3rem) clamp(1.8rem, 5vw, 2.8rem);
      border-radius: var(--radius-letter);
      box-shadow: 
        0 30px 50px -15px rgba(0, 0, 0, 0.8),
        inset 0 0 0 1px rgba(255, 250, 240, 0.7),
        inset 0 0 60px rgba(230, 210, 180, 0.3);
      width: 100%;
      position: relative;
      opacity: 0;
      transform: translateY(30px) scale(0.95) rotate(-0.5deg);
      animation: letterAppear 1s var(--transition-smooth) forwards;
      animation-delay: 0.3s;
      will-change: transform, opacity;
      text-align: center;
    }

    @keyframes letterAppear {
      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(-0.5deg);
      }
    }

    .letter-paper::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="200" height="200" filter="url(%23n)" opacity="0.035"/></svg>');
      border-radius: inherit;
      pointer-events: none;
    }

    .letter-text {
      font-family: var(--font-serif);
      font-size: clamp(1.05rem, 3.8vw, 1.35rem);
      line-height: 1.9;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      z-index: 1;
    }

    .letter-text .letter-line {
      display: block;
      opacity: 0;
      transform: translateY(12px);
      animation: lineReveal 0.7s var(--transition-smooth) forwards;
    }

    .letter-text .letter-line:nth-child(1) { animation-delay: 0.5s; }
    .letter-text .letter-line:nth-child(2) { animation-delay: 0.8s; }
    .letter-text .letter-line:nth-child(3) { animation-delay: 1.1s; }
    .letter-text .letter-line:nth-child(4) { animation-delay: 1.4s; }
    .letter-text .letter-line:nth-child(5) { animation-delay: 1.7s; }

    @keyframes lineReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .letter-text .letter-line.emphasis {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-top: 0.4rem;
      margin-bottom: 0.4rem;
      text-shadow: 0 1px 2px rgba(201, 168, 124, 0.15);
    }

    .letter-signature {
      margin-top: 2rem;
      font-style: italic;
      color: var(--text-soft);
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      opacity: 0;
      transition: opacity 1s ease;
      position: relative;
      z-index: 1;
    }

    .letter-signature.visible {
      opacity: 1;
    }

    .continue-btn {
      margin-top: 2rem;
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      padding: 0.9rem 2.8rem;
      border-radius: 3rem;
      font-size: clamp(0.85rem, 3vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s var(--transition-smooth);
      font-family: var(--font-sans);
      font-weight: 400;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .continue-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .continue-btn:hover {
      background: var(--accent);
      color: var(--background);
      box-shadow: 0 0 30px rgba(201, 168, 124, 0.4);
      transform: translateY(-2px);
    }

    .continue-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* ── SCENE 3: MEMORIES ── */
    .memories-scene {
      background: radial-gradient(ellipse at 40% 40%, #1a1410 0%, #0a0807 100%);
    }

    .memory-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 700px;
      gap: 1.5rem;
    }

    .memory-card {
      background: #faf6f0;
      padding: 1rem 1rem 1.8rem 1rem;
      border-radius: 0.4rem;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 250, 240, 0.3);
      transform: rotate(-1.5deg);
      transition: transform 0.6s var(--transition-smooth), box-shadow 0.6s ease;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(30px) rotate(-1.5deg);
      animation: memoryAppear 0.8s var(--transition-smooth) forwards;
    }

    @keyframes memoryAppear {
      to {
        opacity: 1;
        transform: translateY(0) rotate(-1.5deg);
      }
    }

    .memory-card:hover {
      transform: rotate(0deg) scale(1.02);
      box-shadow: 0 30px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 250, 240, 0.4);
    }

    .memory-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #d4c9bc;
      border-radius: 0.2rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a7a6a;
      font-size: 0.8rem;
      font-style: italic;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.1);
    }

    .memory-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .memory-caption {
      margin-top: 1rem;
      font-family: var(--font-serif);
      color: #3a322b;
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      text-align: center;
      font-style: italic;
      line-height: 1.5;
    }

    .memory-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .memory-btn {
      background: transparent;
      border: 1px solid rgba(201, 168, 124, 0.5);
      color: var(--accent);
      padding: 0.7rem 2rem;
      border-radius: 3rem;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s var(--transition-smooth);
      font-family: var(--font-sans);
    }

    .memory-btn:hover {
      background: rgba(201, 168, 124, 0.15);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .memory-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .memory-counter {
      color: rgba(255, 250, 240, 0.5);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      font-family: var(--font-sans);
    }

    /* ── SCENE 4: VIDEO (YouTube) ── */
    .video-scene {
      background: radial-gradient(ellipse at 50% 50%, #14100e 0%, #080706 100%);
    }

    .video-wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      z-index: 5;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1e1815;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(201, 168, 124, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .video-placeholder {
      color: rgba(255, 250, 240, 0.5);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.95rem;
      text-align: center;
      padding: 2rem;
      line-height: 1.6;
    }

    .video-overlay-text {
      font-family: var(--font-serif);
      font-size: clamp(0.95rem, 3.5vw, 1.3rem);
      color: var(--paper);
      opacity: 0.8;
      letter-spacing: 0.05em;
      text-align: center;
      font-style: italic;
    }

    .video-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    /* ── SCENE 5: REVEAL / FINAL ── */
    .reveal-scene {
      background: radial-gradient(ellipse at 50% 40%, #221b15 0%, #0b0908 100%);
    }

    .reveal-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.5rem;
      z-index: 5;
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .big-number {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 25vw, 12rem);
      line-height: 0.9;
      color: var(--accent);
      text-shadow: 0 0 60px rgba(201, 168, 124, 0.3);
      opacity: 0;
      animation: revealNumber 1.5s var(--transition-smooth) forwards;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    @keyframes revealNumber {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    .reveal-sub {
      font-family: var(--font-serif);
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: var(--paper);
      letter-spacing: 0.15em;
      opacity: 0;
      animation: fadeUp 1.2s var(--transition-smooth) forwards;
      animation-delay: 0.6s;
      font-weight: 300;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .happy-birthday {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 10vw, 4.5rem);
      color: var(--paper);
      letter-spacing: 0.05em;
      margin-top: 1rem;
      opacity: 0;
      animation: glowIn 2s var(--transition-smooth) forwards;
      animation-delay: 1.4s;
      text-shadow: 0 0 40px rgba(230, 203, 170, 0.3);
      line-height: 1.2;
    }

    @keyframes glowIn {
      from {
        opacity: 0;
        transform: scale(0.95);
        text-shadow: 0 0 80px rgba(230, 203, 170, 0.6);
      }
      to {
        opacity: 1;
        transform: scale(1);
        text-shadow: 0 0 40px rgba(230, 203, 170, 0.3);
      }
    }

    .final-date {
      margin-top: 2.5rem;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      letter-spacing: 0.5em;
      color: var(--accent);
      opacity: 0;
      animation: fadeUp 1s var(--transition-smooth) forwards;
      animation-delay: 2.6s;
      font-weight: 300;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      padding: 2rem;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 0.3rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
      transform: scale(0.95);
      transition: transform 0.5s var(--transition-smooth);
    }

    .lightbox.active img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: transparent;
      border: 1px solid rgba(255, 250, 240, 0.3);
      color: var(--paper);
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .lightbox-close:hover {
      background: rgba(255, 250, 240, 0.1);
      border-color: var(--paper);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .envelope {
        max-width: 280px;
      }

      .wax-seal {
        width: 3rem;
        height: 3rem;
        font-size: 1.3rem;
      }

      .letter-paper {
        padding: 1.6rem 1.3rem;
      }

      .letter-text {
        font-size: 1rem;
        line-height: 1.75;
      }

      .letter-text .letter-line.emphasis {
        font-size: 1.2rem;
      }

      .memory-card {
        max-width: 100%;
        padding: 0.8rem 0.8rem 1.4rem 0.8rem;
      }
    }

    @media (min-width: 1024px) {
      .envelope {
        max-width: 420px;
      }

      .letter-paper {
        padding: 3rem 3rem;
      }
    }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .envelope {
        animation: none;
      }

      .scene {
        transition: opacity 0.2s ease;
        transform: none !important;
      }

      .letter-paper {
        opacity: 1;
        transform: rotate(-0.5deg);
        animation: none;
      }

      .letter-text .letter-line {
        opacity: 1;
        transform: none;
        animation: none;
      }

      .memory-card {
        opacity: 1;
        transform: rotate(-1.5deg);
        animation: none;
      }

      .big-number,
      .reveal-sub,
      .happy-birthday,
      .final-date {
        opacity: 1;
        animation: none;
        transform: none;
        filter: none;
      }

      #particles-canvas {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- PARTICLE CANVAS -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <!-- SCENE 0: LOADING -->
  <section class="scene loading-scene active" id="scene-loading" aria-label="Loading screen">
    <div class="loading-container">
      <div class="loading-heart">♡</div>
      <div class="loading-title">A Letter For You</div>
      <div class="loading-subtitle">Preparing something special...</div>
      <div class="loading-bar-wrapper">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
      <div class="loading-percent" id="loading-percent">0%</div>
    </div>
  </section>

  <!-- SCENE 0.5: COUNTDOWN -->
  <section class="scene countdown-scene" id="scene-countdown" aria-label="Birthday countdown">
    <div class="countdown-scene-container">
      <div class="countdown-scene-label">Counting down to</div>
      <div class="countdown-scene-date">14 September 2026</div>
      <div class="countdown-big" id="countdown-big">
        <div class="countdown-big-item">
          <span class="countdown-big-value" id="cd-days">--</span>
          <span class="countdown-big-label">Days</span>
        </div>
        <div class="countdown-big-item">
          <span class="countdown-big-value" id="cd-hours">--</span>
          <span class="countdown-big-label">Hours</span>
        </div>
        <div class="countdown-big-item">
          <span class="countdown-big-value" id="cd-minutes">--</span>
          <span class="countdown-big-label">Minutes</span>
        </div>
        <div class="countdown-big-item">
          <span class="countdown-big-value" id="cd-seconds">--</span>
          <span class="countdown-big-label">Seconds</span>
        </div>
      </div>
      <div class="countdown-scene-message" id="countdown-scene-message"></div>
      <button class="countdown-continue-btn" id="countdown-continue-btn" aria-label="Continue to the letter">Continue</button>
    </div>
  </section>

  <!-- SCENE 1: ENVELOPE -->
  <section class="scene envelope-scene" id="scene-envelope" aria-label="Opening scene with envelope">
    <div class="envelope-wrapper">
      <button class="envelope" id="envelope" aria-label="Open the letter">
        <div class="envelope-back"></div>
        <div class="envelope-body">
          <div class="envelope-front"></div>
        </div>
        <div class="envelope-flap"></div>
        <div class="wax-seal" aria-hidden="true">♡</div>
      </button>
      <div class="instruction" id="instruction">
        <span class="primary">Open the letter</span>
        <span class="secondary">Something is waiting for you...</span>
      </div>
    </div>
  </section>

  <!-- SCENE 2: LETTER -->
  <section class="scene letter-scene" id="scene-letter" aria-label="Personal letter">
    <div class="letter-container">
      <div class="letter-paper" id="letter-paper">
        <div class="letter-text" id="letter-text"></div>
        <div class="letter-signature" id="letter-signature">With love,</div>
      </div>
      <button class="continue-btn" id="continue-btn" aria-label="Continue to memories">Continue</button>
    </div>
  </section>

  <!-- SCENE 3: MEMORIES -->
  <section class="scene memories-scene" id="scene-memories" aria-label="Photo memories">
    <div class="memory-container">
      <div class="memory-card" id="memory-card">
        <div class="memory-image" id="memory-image">
          <span>Photo</span>
        </div>
        <div class="memory-caption" id="memory-caption"></div>
      </div>
      <div class="memory-controls">
        <button class="memory-btn" id="next-memory-btn" aria-label="Next memory">Next Memory</button>
        <span class="memory-counter" id="memory-counter"></span>
      </div>
    </div>
  </section>

  <!-- SCENE 4: VIDEO (YouTube) -->
  <section class="scene video-scene" id="scene-video" aria-label="Video memory">
    <div class="video-wrapper">
      <div class="video-frame" id="video-frame">
        <div class="video-placeholder" id="video-placeholder">
          Loading video...
        </div>
      </div>
      <div class="video-overlay-text">A few moments worth remembering.</div>
      <div class="video-controls">
        <button class="memory-btn" id="video-continue-btn" aria-label="Continue to birthday reveal">Continue</button>
        <button class="memory-btn" id="replay-btn" aria-label="Replay the experience">Replay</button>
      </div>
    </div>
  </section>

  <!-- SCENE 5: REVEAL / FINAL -->
  <section class="scene reveal-scene" id="scene-reveal" aria-label="Birthday reveal">
    <div class="reveal-container">
      <div class="big-number" id="big-number">14</div>
      <div class="reveal-sub" id="reveal-sub">September 2026</div>
      <div class="happy-birthday" id="happy-birthday">Happy Birthday</div>
      <div class="final-date" id="final-date">14 • 09 • 2026</div>
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close enlarged photo">✕</button>
    <img src="" alt="" id="lightbox-img">
  </div>

  <!-- MULTIPLE AUDIO ELEMENTS -->
  <!-- Tambahkan / kurangi sesuai kebutuhan di CONFIG.audioTracks -->
  <audio id="birthday-audio-1" src="../assets/audio/birthday.mp3" loop preload="auto"></audio>
  <audio id="birthday-audio-2" src="../assets/audio/birthday-2.mp3" loop preload="auto"></audio>

  <script>
    (function() {
      'use strict';

      // ── CONFIG ──
      const CONFIG = {
        recipientName: 'You',
        birthdayDate: '2026-09-14',

        // ── MULTIPLE AUDIO TRACKS ──
        // Setiap track akan diputar otomatis saat amplop terbuka.
        // - src: path ke file audio (relatif dari HTML)
        // - volume: 0.0 - 1.0
        // - loop: apakah diulang terus
        // - delay: jeda sebelum mulai diputar (ms)
        audioTracks: [
          { src: '../assets/audio/birthday.mp3', volume: 0.5, loop: true, delay: 0 },
          { src: '../assets/audio/birthday-2.mp3', volume: 0.35, loop: true, delay: 1500 }
        ],

        // ── YOUTUBE VIDEO ──
        // Ganti youtubeId dengan ID video YouTube Anda.
        // Contoh: https://www.youtube.com/watch?v=dQw4w9WgXcQ → ID = dQw4w9WgXcQ
        youtubeId: 'dQw4w9WgXcQ',
        youtubeStart: 0, // detik mulai
        youtubeAutoplay: true,
        youtubeMute: false,

        openingMessage: 'Something is waiting for you...',

        letter: [
          'Dear You,',
          'Some days deserve to be remembered.',
          'And today is one of them.',
          '14 September 2026.',
          'Happy Birthday.'
        ],

        memories: [
          { image: '../assets/images/photo-01.jpg', caption: 'The day we laughed until we cried.' },
          { image: '../assets/images/photo-02.jpg', caption: 'A quiet moment that meant everything.' },
          { image: '../assets/images/photo-03.jpg', caption: 'Adventure with you is my favourite.' }
        ],

        finalMessage: [
          'Another chapter begins today.',
          'May this year bring you beautiful moments,',
          'unexpected happiness,',
          'and many reasons to smile.',
          'Happy Birthday.'
        ]
      };

      // ── STATE ──
      const STATE = {
        currentScene: 'loading',
        loadingComplete: false,
        countdownComplete: false,
        envelopeOpened: false,
        letterShown: false,
        memoryIndex: 0,
        isRevealActive: false,
        reducedMotion: false,
        audioElements: [], // menyimpan <audio> yang dibuat dinamis
        videoInitialized: false
      };

      // ── DOM REFERENCES ──
      const DOM = {
        scenes: {
          loading: document.getElementById('scene-loading'),
          countdown: document.getElementById('scene-countdown'),
          envelope: document.getElementById('scene-envelope'),
          letter: document.getElementById('scene-letter'),
          memories: document.getElementById('scene-memories'),
          video: document.getElementById('scene-video'),
          reveal: document.getElementById('scene-reveal')
        },
        loadingBar: document.getElementById('loading-bar'),
        loadingPercent: document.getElementById('loading-percent'),
        countdownBig: {
          days: document.getElementById('cd-days'),
          hours: document.getElementById('cd-hours'),
          minutes: document.getElementById('cd-minutes'),
          seconds: document.getElementById('cd-seconds')
        },
        countdownSceneMessage: document.getElementById('countdown-scene-message'),
        countdownContinueBtn: document.getElementById('countdown-continue-btn'),
        envelope: document.getElementById('envelope'),
        instruction: document.getElementById('instruction'),
        letterPaper: document.getElementById('letter-paper'),
        letterText: document.getElementById('letter-text'),
        letterSignature: document.getElementById('letter-signature'),
        continueBtn: document.getElementById('continue-btn'),
        memoryCard: document.getElementById('memory-card'),
        memoryImage: document.getElementById('memory-image'),
        memoryCaption: document.getElementById('memory-caption'),
        memoryCounter: document.getElementById('memory-counter'),
        nextMemoryBtn: document.getElementById('next-memory-btn'),
        videoFrame: document.getElementById('video-frame'),
        videoPlaceholder: document.getElementById('video-placeholder'),
        videoContinueBtn: document.getElementById('video-continue-btn'),
        bigNumber: document.getElementById('big-number'),
        revealSub: document.getElementById('reveal-sub'),
        happyBirthday: document.getElementById('happy-birthday'),
        finalDate: document.getElementById('final-date'),
        replayBtn: document.getElementById('replay-btn'),
        particlesCanvas: document.getElementById('particles-canvas'),
        lightbox: document.getElementById('lightbox'),
        lightboxImg: document.getElementById('lightbox-img'),
        lightboxClose: document.getElementById('lightbox-close')
      };

      // ── UTILITIES ──
      function prefersReducedMotion() {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      // ── SCENE CONTROLLER ──
      function showScene(sceneName) {
        if (!DOM.scenes[sceneName]) return;
        
        const currentSceneEl = DOM.scenes[STATE.currentScene];
        const nextSceneEl = DOM.scenes[sceneName];
        
        if (currentSceneEl) {
          currentSceneEl.classList.remove('active');
          currentSceneEl.classList.add('leaving');
          setTimeout(() => {
            currentSceneEl.classList.remove('leaving');
            currentSceneEl.classList.add('hidden');
          }, 1000);
        }
        
        if (nextSceneEl) {
          nextSceneEl.classList.remove('hidden');
          void nextSceneEl.offsetWidth;
          setTimeout(() => {
            nextSceneEl.classList.add('active');
          }, 50);
        }
        
        STATE.currentScene = sceneName;
      }

      // ── LOADING SCREEN ──
      function runLoadingScreen() {
        return new Promise((resolve) => {
          let progress = 0;
          const duration = 2800;
          const intervalTime = 40;
          const steps = duration / intervalTime;
          const increment = 100 / steps;

          const timer = setInterval(() => {
            progress += increment;
            if (progress >= 100) {
              progress = 100;
              clearInterval(timer);
              DOM.loadingBar.style.width = '100%';
              DOM.loadingPercent.textContent = '100%';
              setTimeout(() => {
                resolve();
              }, 600);
            } else {
              DOM.loadingBar.style.width = progress + '%';
              DOM.loadingPercent.textContent = Math.floor(progress) + '%';
            }
          }, intervalTime);
        });
      }

      // ── COUNTDOWN (Big Scene) ──
      function updateBigCountdown() {
        const target = new Date(CONFIG.birthdayDate + 'T00:00:00');
        const now = new Date();
        const diff = target - now;

        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          DOM.countdownBig.days.textContent = String(days).padStart(2, '0');
          DOM.countdownBig.hours.textContent = String(hours).padStart(2, '0');
          DOM.countdownBig.minutes.textContent = String(minutes).padStart(2, '0');
          DOM.countdownBig.seconds.textContent = String(seconds).padStart(2, '0');

          if (DOM.countdownSceneMessage) {
            DOM.countdownSceneMessage.textContent = 'The special day is approaching...';
          }
        } else {
          DOM.countdownBig.days.textContent = '00';
          DOM.countdownBig.hours.textContent = '00';
          DOM.countdownBig.minutes.textContent = '00';
          DOM.countdownBig.seconds.textContent = '00';

          const targetDate = new Date(CONFIG.birthdayDate);
          const today = new Date();
          if (today.toDateString() === targetDate.toDateString()) {
            DOM.countdownSceneMessage.textContent = 'Today is your day.';
          } else {
            DOM.countdownSceneMessage.textContent = 'Your birthday has arrived.';
          }

          if (DOM.countdownContinueBtn) {
            DOM.countdownContinueBtn.classList.add('visible');
          }
        }
      }

      let bigCountdownInterval = null;

      function startBigCountdown() {
        updateBigCountdown();
        if (bigCountdownInterval) clearInterval(bigCountdownInterval);
        bigCountdownInterval = setInterval(updateBigCountdown, 1000);

        setTimeout(() => {
          if (DOM.countdownContinueBtn) {
            DOM.countdownContinueBtn.classList.add('visible');
          }
        }, 4000);
      }

      // ── ENVELOPE CONTROLLER ──
      async function openEnvelope() {
        if (STATE.envelopeOpened) return;
        STATE.envelopeOpened = true;

        DOM.envelope.classList.add('open');
        
        await delay(1200);

        // Putar semua audio otomatis
        startAllMusic();

        showScene('letter');
        
        await delay(600);
        showLetter();
      }

      // ── LETTER (langsung muncul, tanpa typing) ──
      function showLetter() {
        if (STATE.letterShown) return;
        STATE.letterShown = true;

        const lines = CONFIG.letter;
        DOM.letterText.innerHTML = '';

        lines.forEach((line, index) => {
          const span = document.createElement('span');
          span.className = 'letter-line';
          if (index === lines.length - 1) {
            span.classList.add('emphasis');
          }
          span.textContent = line;
          DOM.letterText.appendChild(span);
        });

        setTimeout(() => {
          DOM.letterSignature.classList.add('visible');
        }, 2000);

        setTimeout(() => {
          DOM.continueBtn.classList.add('visible');
        }, 2400);
      }

      // ── AUDIO CONTROLLER (multiple tracks, tanpa UI) ──
      function createAudioElements() {
        // Hapus audio lama jika ada
        STATE.audioElements.forEach(audio => {
          try { audio.pause(); } catch(e) {}
        });
        STATE.audioElements = [];

        CONFIG.audioTracks.forEach((track, index) => {
          const audio = new Audio();
          audio.src = track.src;
          audio.loop = track.loop !== false;
          audio.volume = typeof track.volume === 'number' ? track.volume : 0.5;
          audio.preload = 'auto';
          audio.dataset.index = index;
          STATE.audioElements.push(audio);
        });
      }

      function startAllMusic() {
        if (STATE.audioElements.length === 0) {
          createAudioElements();
        }

        STATE.audioElements.forEach((audio, index) => {
          const trackConfig = CONFIG.audioTracks[index] || {};
          const startDelay = typeof trackConfig.delay === 'number' ? trackConfig.delay : 0;
          const vol = typeof trackConfig.volume === 'number' ? trackConfig.volume : 0.5;

          audio.volume = vol;

          if (startDelay > 0) {
            setTimeout(() => {
              const p = audio.play();
              if (p && p.catch) p.catch(() => {});
            }, startDelay);
          } else {
            const p = audio.play();
            if (p && p.catch) p.catch(() => {});
          }
        });
      }

      function stopAllMusic() {
        STATE.audioElements.forEach(audio => {
          try {
            audio.pause();
            audio.currentTime = 0;
          } catch(e) {}
        });
      }

      // ── MEMORY / GALLERY ──
      function showMemory(index) {
        const memories = CONFIG.memories;
        if (!memories || memories.length === 0) return;
        
        const mem = memories[index % memories.length];
        
        if (DOM.memoryImage) {
          DOM.memoryImage.innerHTML = '';
          const img = document.createElement('img');
          img.src = mem.image;
          img.alt = mem.caption || 'Memory photo';
          img.loading = 'lazy';
          
          img.onerror = function() {
            DOM.memoryImage.innerHTML = '<span>Photo</span>';
          };
          
          img.onload = function() {
            DOM.memoryImage.innerHTML = '';
            DOM.memoryImage.appendChild(img);
          };
          
          DOM.memoryImage.innerHTML = '<span>Photo</span>';
          DOM.memoryImage.appendChild(img);
          
          img.style.cursor = 'pointer';
          img.addEventListener('click', () => openLightbox(mem.image, mem.caption));
        }
        
        if (DOM.memoryCaption) {
          DOM.memoryCaption.textContent = mem.caption || '';
        }
        
        if (DOM.memoryCounter) {
          DOM.memoryCounter.textContent = `${index + 1} / ${memories.length}`;
        }
        
        if (DOM.memoryCard) {
          DOM.memoryCard.style.animation = 'none';
          void DOM.memoryCard.offsetWidth;
          DOM.memoryCard.style.animation = 'memoryAppear 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards';
        }

        if (DOM.nextMemoryBtn) {
          if (index >= memories.length - 1) {
            DOM.nextMemoryBtn.textContent = 'Continue';
          } else {
            DOM.nextMemoryBtn.textContent = 'Next Memory';
          }
        }
      }

      function nextMemory() {
        const memories = CONFIG.memories;
        if (!memories || memories.length === 0) return;
        
        if (STATE.memoryIndex >= memories.length - 1) {
          showScene('video');
          initVideo();
        } else {
          STATE.memoryIndex++;
          showMemory(STATE.memoryIndex);
        }
      }

      // ── VIDEO (YouTube Embed) ──
      function initVideo() {
        if (!DOM.videoFrame) return;

        const videoId = CONFIG.youtubeId;
        if (!videoId) {
          DOM.videoFrame.innerHTML = '<div class="video-placeholder">No YouTube video ID set.<br>Edit CONFIG.youtubeId.</div>';
          return;
        }

        const startParam = CONFIG.youtubeStart > 0 ? `&start=${CONFIG.youtubeStart}` : '';
        const autoplayParam = CONFIG.youtubeAutoplay ? '&autoplay=1' : '';
        const muteParam = CONFIG.youtubeMute ? '&mute=1' : '';
        const src = `https://www.youtube.com/embed/${videoId}?rel=0${startParam}${autoplayParam}${muteParam}`;

        DOM.videoFrame.innerHTML = `
          <iframe
            src="${src}"
            title="YouTube video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            loading="lazy"
          ></iframe>
        `;

        STATE.videoInitialized = true;
      }

      // ── LIGHTBOX ──
      function openLightbox(src, alt) {
        if (!DOM.lightbox || !DOM.lightboxImg) return;
        DOM.lightboxImg.src = src;
        DOM.lightboxImg.alt = alt || 'Enlarged photo';
        DOM.lightbox.classList.add('active');
      }

      function closeLightbox() {
        if (DOM.lightbox) {
          DOM.lightbox.classList.remove('active');
        }
      }

      // ── PARTICLES ──
      function initParticles() {
        if (STATE.reducedMotion) return;
        
        const canvas = DOM.particlesCanvas;
        if (!canvas) return;
        
        const ctx = canvas.getContext('2d');
        let width, height;
        const particles = [];
        const particleCount = 45;
        
        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        }
        
        function createParticle() {
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 0.5,
            speedX: (Math.random() - 0.5) * 0.15,
            speedY: (Math.random() - 0.5) * 0.15,
            opacity: Math.random() * 0.5 + 0.1,
            pulse: Math.random() * Math.PI * 2
          };
        }
        
        function initParticleArray() {
          particles.length = 0;
          for (let i = 0; i < particleCount; i++) {
            particles.push(createParticle());
          }
        }
        
        function draw() {
          ctx.clearRect(0, 0, width, height);
          
          particles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;
            p.pulse += 0.01;
            
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;
            
            const flicker = Math.sin(p.pulse) * 0.15 + 0.85;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(201, 168, 124, ${p.opacity * flicker})`;
            ctx.fill();
          });
          
          requestAnimationFrame(draw);
        }
        
        resize();
        initParticleArray();
        draw();
        
        window.addEventListener('resize', () => {
          resize();
        });
      }

      // ── INITIALIZATION ──
      async function init() {
        STATE.reducedMotion = prefersReducedMotion();
        
        initParticles();
        createAudioElements();
        showMemory(0);
        
        // Event: Envelope click
        if (DOM.envelope) {
          DOM.envelope.addEventListener('click', openEnvelope);
          DOM.envelope.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openEnvelope();
            }
          });
        }
        
        // Event: Continue to memories
        if (DOM.continueBtn) {
          DOM.continueBtn.addEventListener('click', () => {
            showScene('memories');
          });
        }
        
        // Event: Next memory
        if (DOM.nextMemoryBtn) {
          DOM.nextMemoryBtn.addEventListener('click', nextMemory);
        }
        
        // Event: Continue from video
        if (DOM.videoContinueBtn) {
          DOM.videoContinueBtn.addEventListener('click', () => {
            showScene('reveal');
            STATE.isRevealActive = true;
          });
        }
        
        // Event: Replay (di scene video)
        if (DOM.replayBtn) {
          DOM.replayBtn.addEventListener('click', resetExperience);
        }
        
        // Event: Lightbox close
        if (DOM.lightboxClose) {
          DOM.lightboxClose.addEventListener('click', closeLightbox);
        }
        if (DOM.lightbox) {
          DOM.lightbox.addEventListener('click', (e) => {
            if (e.target === DOM.lightbox) {
              closeLightbox();
            }
          });
        }
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && DOM.lightbox.classList.contains('active')) {
            closeLightbox();
          }
        });

        // Event: Countdown continue button
        if (DOM.countdownContinueBtn) {
          DOM.countdownContinueBtn.addEventListener('click', () => {
            showScene('envelope');
          });
        }

        // ── START FLOW ──
        await delay(300);
        await runLoadingScreen();
        
        showScene('countdown');
        startBigCountdown();
      }

      // ── RESET EXPERIENCE ──
      function resetExperience() {
        stopAllMusic();

        STATE.envelopeOpened = false;
        STATE.letterShown = false;
        STATE.memoryIndex = 0;
        STATE.isRevealActive = false;
        STATE.videoInitialized = false;

        if (DOM.envelope) {
          DOM.envelope.classList.remove('open');
        }
        
        if (DOM.letterText) {
          DOM.letterText.innerHTML = '';
        }
        if (DOM.letterSignature) {
          DOM.letterSignature.classList.remove('visible');
        }
        if (DOM.continueBtn) {
          DOM.continueBtn.classList.remove('visible');
        }

        // Reset video frame ke placeholder
        if (DOM.videoFrame) {
          DOM.videoFrame.innerHTML = '<div class="video-placeholder">Loading video...</div>';
        }
        
        showMemory(0);
        
        if (bigCountdownInterval) {
          clearInterval(bigCountdownInterval);
          bigCountdownInterval = null;
        }
        showScene('countdown');
        startBigCountdown();
        
        if (DOM.instruction) {
          DOM.instruction.style.opacity = '0.7';
        }
        
        setTimeout(() => {
          STATE.envelopeOpened = false;
        }, 500);
      }

      window.resetExperience = resetExperience;

      // ── START ──
      document.addEventListener('DOMContentLoaded', init);
      
    })();
  </script>
</body>
</html>
